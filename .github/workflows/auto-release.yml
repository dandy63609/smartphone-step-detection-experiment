name: Auto Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Slim APK & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests Before Release
        run: flutter test

      - name: Decode Android Release Keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build Optimized Split-ABI APKs
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # Strip leading 'v' e.g. v0.2.0 -> 0.2.0
          VERSION_NAME="${TAG_NAME#v}"
          # Incremental integer build number for Android versionCode
          VERSION_CODE="${{ github.run_number }}"
          echo "Building Release APK with Version Name: $VERSION_NAME, Version Code: $VERSION_CODE"

          flutter build apk --release --split-per-abi \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --tree-shake-icons --obfuscate --split-debug-info=build/debug-info

      - name: Prepare Release APK Assets
        id: prepare_apks
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          mkdir -p release-assets

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "release-assets/step-detection-${TAG_NAME}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "release-assets/step-detection-${TAG_NAME}-armeabi-v7a.apk"

          echo "### 📦 Generated APK Sizes" >> $GITHUB_STEP_SUMMARY
          ls -lh release-assets/*.apk | awk '{print "- **" $9 "**: " $5}' >> $GITHUB_STEP_SUMMARY

      # Reading the changelog configuration and generating the changelog based on commit messages
      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: ".github/changelog-config.json"
          mode: "COMMIT"
          token: ${{ secrets.GITHUB_TOKEN }}

      # Prepare a stable step output for downstream steps
      - name: Prepare Changelog Output
        id: prep_changelog
        env:
          CHANGELOG: ${{ steps.build_changelog.outputs.changelog }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          {
            echo 'changelog<<EOF'
            printf '%s\n\n' "$CHANGELOG"
            echo '### 📱 Download APK (Android)'
            echo "- **\`step-detection-${TAG_NAME}-arm64-v8a.apk\`** *(Recommended for modern 64-bit Android devices)*"
            echo "- **\`step-detection-${TAG_NAME}-armeabi-v7a.apk\`** *(For legacy 32-bit Android devices)*"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Creating a GitHub release with the generated changelog and slimmed APK files attached
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.prep_changelog.outputs.changelog }}
          files: |
            release-assets/step-detection-*-arm64-v8a.apk
            release-assets/step-detection-*-armeabi-v7a.apk
          draft: false
          prerelease: false
