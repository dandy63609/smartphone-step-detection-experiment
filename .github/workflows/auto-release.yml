name: Auto Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Slim APK & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests Before Release
        run: flutter test

      - name: Build Optimized Split-ABI APKs
        run: |
          flutter build apk --release --split-per-abi --tree-shake-icons --obfuscate --split-debug-info=build/debug-info

      - name: Prepare Release APK Assets
        id: prepare_apks
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          mkdir -p release-assets

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "release-assets/step-detection-${TAG_NAME}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "release-assets/step-detection-${TAG_NAME}-armeabi-v7a.apk"

          echo "### 📦 Generated APK Sizes" >> $GITHUB_STEP_SUMMARY
          ls -lh release-assets/*.apk | awk '{print "- **" $9 "**: " $5}' >> $GITHUB_STEP_SUMMARY

      # Reading the changelog configuration and generating the changelog based on commit messages
      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: ".github/changelog-config.json"
          mode: "COMMIT"
          token: ${{ secrets.GITHUB_TOKEN }}

      # Prepare a stable step output for downstream steps
      - name: Prepare Changelog Output
        id: prep_changelog
        env:
          CHANGELOG: ${{ steps.build_changelog.outputs.changelog }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          {
            echo 'changelog<<EOF'
            printf '%s\n\n' "$CHANGELOG"
            echo '### 📱 Download APK (Android)'
            echo "- **`step-detection-${TAG_NAME}-arm64-v8a.apk`** *(Recommended — untuk hampir semua HP Android modern 64-bit)*"
            echo "- **`step-detection-${TAG_NAME}-armeabi-v7a.apk`** *(Untuk HP Android 32-bit lama)*"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Creating a GitHub release with the generated changelog and slimmed APK files attached
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.prep_changelog.outputs.changelog }}
          files: |
            release-assets/step-detection-*-arm64-v8a.apk
            release-assets/step-detection-*-armeabi-v7a.apk
          draft: false
          prerelease: false
