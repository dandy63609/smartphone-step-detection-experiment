name: CI & Security Guard

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sensitive-file-guard:
    name: Sensitive & Keystore File Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect forbidden file changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git ls-tree -r --name-only "$head_sha")"
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          # Mencegah file .env, keystore Android (.jks/.keystore/key.properties), dan credentials ter-commit
          forbidden_files="$(printf '%s\n' "$changed_files" | grep -E '(^|/)\.env$|(^|/)key\.properties$|\.(jks|keystore)$|(^|/)google-services\.json$|(^|/)credentials(/|$)|(^|/)temp/.*' || true)"

          if [[ -n "$forbidden_files" ]]; then
            echo "❌ Detected sensitive/secret files that are forbidden to commit:"
            printf '%s\n' "$forbidden_files"
            echo "Do not commit .env, key.properties, .jks/.keystore, or credentials/ folders."
            exit 1
          fi

          echo "✅ Safe: No sensitive files committed."

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: sensitive-file-guard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter-ci:
    name: Flutter Analyze & Unit Tests
    runs-on: ubuntu-latest
    needs: sensitive-file-guard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test
